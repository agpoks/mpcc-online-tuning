<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="680" height="140" role="img" aria-label="mpcc-online-tuning">
  <defs>
    <linearGradient id="mpb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="mpsheenb" cx="32%" cy="22%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  
    <linearGradient id="mptext" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <g transform="translate(6,6) scale(0.64)">

  <rect x="14" y="14" width="172" height="172" rx="46" fill="url(#mpb)"/>
  <rect x="14" y="14" width="172" height="172" rx="46" fill="url(#mpsheenb)"/>

  <!-- the reference path, and the prediction horizon fanning ahead of the car -->
  <path d="M30,124 C58,124 66,86 100,86 C134,86 142,58 170,58"
        fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="16" stroke-linecap="round"/>
  <path d="M30,124 C58,124 66,86 100,86 C134,86 142,58 170,58"
        fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5"
        stroke-dasharray="7 7" stroke-linecap="round"/>

  <!-- predicted states along the horizon, shrinking with confidence -->
  <g fill="#ffffff">
    <circle cx="62" cy="120" r="6.5" fill-opacity="0.95"/>
    <circle cx="84" cy="98" r="5.6" fill-opacity="0.78"/>
    <circle cx="108" cy="85" r="4.8" fill-opacity="0.62"/>
    <circle cx="132" cy="74" r="4.0" fill-opacity="0.46"/>
    <circle cx="154" cy="63" r="3.2" fill-opacity="0.32"/>
  </g>
  <!-- the car -->
  <g transform="translate(40,128) rotate(-8)">
    <rect x="-11" y="-7" width="22" height="14" rx="4" fill="#ffffff"/>
  </g>

  <!-- the weights being tuned: three sliders, set to different values -->
  <g stroke="#ffffff" stroke-linecap="round">
    <g stroke-opacity="0.35" stroke-width="4">
      <line x1="46" y1="152" x2="154" y2="152"/>
      <line x1="46" y1="164" x2="154" y2="164"/>
      <line x1="46" y1="176" x2="154" y2="176"/>
    </g>
  </g>
  <g fill="#ffffff">
    <circle cx="72" cy="152" r="6"/>
    <circle cx="126" cy="164" r="6"/>
    <circle cx="96" cy="176" r="6"/>
  </g>
  </g>

  <text x="150" y="66" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="url(#mptext)">mpcc-online-tuning</text>
  <text x="150" y="92" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">MPCC cost weights tuned every control tick, from one TD error</text>
</svg>
